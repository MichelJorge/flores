<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Um convite especial 🌻</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,600&family=Dancing+Script:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy-deep:#0b1730;
    --navy-mid:#132a52;
    --navy-hi:#274a7d;
    --swirl:#3f74ac;
    --sunflower:#f4b942;
    --sunflower-dark:#d9861f;
    --sunflower-edge:#c96f1a;
    --leaf:#5f8a4e;
    --leaf-dark:#3c6339;
    --cream:#faf3e2;
    --cream-dim:#efe4c9;
    --gold:#d9a441;
    --gold-hi:#f1c876;
    --ink:#241e0f;
    --brown:#5a3a1e;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:'Poppins',sans-serif;
    background:var(--navy-deep);
    color:var(--cream);
    overflow:hidden;
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  /* ---------- background: starry night ---------- */
  .sky{
    position:fixed; inset:0;
    background:
      radial-gradient(ellipse at 20% 15%, rgba(63,116,172,.55), transparent 55%),
      radial-gradient(ellipse at 80% 70%, rgba(39,74,125,.6), transparent 60%),
      linear-gradient(160deg, var(--navy-deep) 0%, var(--navy-mid) 55%, var(--navy-deep) 100%);
    overflow:hidden;
    z-index:0;
  }
  .swirl{
    position:absolute;
    border-radius:50%;
    filter:blur(18px);
    opacity:.35;
    background:conic-gradient(from 0deg, var(--swirl), transparent 40%, var(--navy-hi) 60%, transparent 90%);
    animation:swirlRotate 50s linear infinite;
  }
  .swirl.s1{width:340px; height:340px; top:-80px; left:-90px; animation-duration:70s;}
  .swirl.s2{width:260px; height:260px; bottom:-60px; right:-70px; animation-duration:55s; animation-direction:reverse;}
  .swirl.s3{width:200px; height:200px; top:40%; left:60%; animation-duration:40s;}
  @keyframes swirlRotate{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}

  .star{
    position:absolute;
    background:#fff7dd;
    border-radius:50%;
    animation:twinkle 3.2s ease-in-out infinite;
  }
  @keyframes twinkle{0%,100%{opacity:.15;}50%{opacity:1;}}

  /* ---------- app shell ---------- */
  .app{
    position:relative;
    z-index:1;
    width:100%;
    max-width:430px;
    height:100vh;
    height:100dvh;
    max-height:900px;
    display:flex;
    flex-direction:column;
    padding:0;
  }

  .progress{
    display:none;
    align-items:center;
    justify-content:center;
    gap:8px;
    padding:18px 0 6px;
    z-index:3;
  }
  .progress.show{display:flex;}
  .dot{width:7px; height:7px; border-radius:50%; background:rgba(250,243,226,.25); transition:all .35s ease;}
  .dot.active{background:var(--gold-hi); width:20px; border-radius:5px;}
  .dot.done{background:var(--gold);}

  .back-btn{
    position:absolute;
    top:16px; left:14px;
    z-index:5;
    background:rgba(250,243,226,.1);
    border:1px solid rgba(250,243,226,.25);
    color:var(--cream);
    width:36px; height:36px;
    border-radius:50%;
    font-size:16px;
    display:none;
    align-items:center;
    justify-content:center;
    cursor:pointer;
  }
  .screen.active .back-btn{display:flex;}

  .screen{
    display:none;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    flex:1;
    width:100%;
    padding:14px 24px 28px;
    position:relative;
    overflow-y:auto;
  }
  .screen.active{display:flex;}
  .screen.active > *{animation:fadeUp .7s ease both;}

  @keyframes fadeUp{
    0%{opacity:0; transform:translateY(16px);}
    100%{opacity:1; transform:translateY(0);}
  }

  h1,h2{font-family:'Playfair Display',serif; margin:0;}

  /* ---------- SCREEN 1: bouquet ---------- */
  #screen1{justify-content:center; padding-top:0;}
  .bouquet-wrap{
    width:100%;
    max-width:320px;
    aspect-ratio:4/5;
    animation:none !important;
  }
  .bouquet-wrap svg{width:100%; height:100%; overflow:visible;}

  .stem{
    fill:none;
    stroke:var(--leaf-dark);
    stroke-width:4;
    stroke-linecap:round;
    stroke-dasharray:260;
    stroke-dashoffset:260;
    animation:drawStem 1.1s ease forwards;
  }
  @keyframes drawStem{to{stroke-dashoffset:0;}}

  .leaf{
    fill:var(--leaf);
    opacity:0;
    transform-box:fill-box;
    transform-origin:center;
    animation:leafPop .6s ease forwards;
  }
  @keyframes leafPop{
    0%{opacity:0; transform:scale(0) rotate(-14deg);}
    70%{opacity:1;}
    100%{opacity:1; transform:scale(1) rotate(0deg);}
  }

  .paper{
    opacity:0;
    transform-box:fill-box;
    transform-origin:50% 100%;
    animation:paperRise .9s cubic-bezier(.2,.8,.3,1.1) forwards;
  }
  @keyframes paperRise{
    0%{opacity:0; transform:scaleY(0);}
    100%{opacity:1; transform:scaleY(1);}
  }
  .paper-swirl{opacity:0; animation:fadeIn .8s ease forwards;}
  @keyframes fadeIn{to{opacity:.55;}}

  .puff{
    opacity:0;
    transform-box:fill-box;
    transform-origin:center;
    animation:puffPop .5s ease forwards;
  }
  @keyframes puffPop{
    0%{opacity:0; transform:scale(0);}
    100%{opacity:1; transform:scale(1);}
  }

  .petal{
    opacity:0;
    transform-box:fill-box;
    transform-origin:center;
    animation:petalPop .5s cubic-bezier(.3,1.4,.5,1) forwards;
  }
  @keyframes petalPop{
    0%{opacity:0; transform:scale(0);}
    65%{opacity:1; transform:scale(1.18);}
    100%{opacity:1; transform:scale(1);}
  }
  .fcenter{
    opacity:0;
    transform-box:fill-box;
    transform-origin:center;
    animation:puffPop .5s ease forwards;
  }

  .ribbon{
    opacity:0;
    transform-box:fill-box;
    transform-origin:center;
    animation:ribbonPop .7s cubic-bezier(.3,1.6,.4,1) forwards;
  }
  @keyframes ribbonPop{
    0%{opacity:0; transform:scale(0) rotate(-18deg);}
    60%{opacity:1; transform:scale(1.12) rotate(6deg);}
    100%{opacity:1; transform:scale(1) rotate(0deg);}
  }

  .message{
    text-align:center;
    margin-top:6px;
  }
  .message .line1{
    font-family:'Dancing Script',cursive;
    font-size:clamp(26px,7vw,34px);
    color:var(--gold-hi);
    opacity:0;
    animation:fadeUp .8s ease forwards;
    animation-delay:2.6s;
    display:block;
  }
  .message .line2{
    font-family:'Playfair Display',serif;
    font-style:italic;
    font-size:clamp(17px,4.6vw,20px);
    color:var(--cream);
    opacity:.92;
    margin-top:6px;
    opacity:0;
    animation:fadeUp .8s ease forwards;
    animation-delay:3.3s;
    display:block;
  }
  .cta{
    opacity:0;
    animation:fadeUp .8s ease forwards;
    animation-delay:4s;
    margin-top:20px;
  }

  /* ---------- buttons ---------- */
  .btn{
    font-family:'Poppins',sans-serif;
    font-weight:500;
    font-size:15px;
    letter-spacing:.3px;
    border:none;
    border-radius:999px;
    padding:14px 30px;
    background:linear-gradient(135deg, var(--gold-hi), var(--gold));
    color:#2a1c05;
    cursor:pointer;
    box-shadow:0 6px 18px rgba(217,164,65,.35);
    transition:transform .2s ease, box-shadow .2s ease, opacity .2s ease;
  }
  .btn:active{transform:scale(.96);}
  .btn:disabled{opacity:.35; box-shadow:none; cursor:not-allowed;}
  .btn.ghost{
    background:transparent;
    border:1.5px solid var(--gold);
    color:var(--gold-hi);
    box-shadow:none;
  }

  /* ---------- SCREEN 2: calendar ---------- */
  .title-block{text-align:center; margin-bottom:18px;}
  .title-block h2{font-size:clamp(21px,5.5vw,26px); color:var(--cream);}
  .title-block .sub{font-size:13px; color:var(--gold-hi); font-style:italic; font-family:'Playfair Display',serif; margin-top:4px;}

  .card-panel{
    background:linear-gradient(160deg, var(--cream), var(--cream-dim));
    color:var(--ink);
    border-radius:22px;
    padding:18px 16px;
    width:100%;
    max-width:360px;
    box-shadow:0 14px 30px rgba(0,0,0,.35);
  }

  .cal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
  .cal-head button{
    background:none; border:none; font-size:18px; color:var(--brown); cursor:pointer;
    width:32px; height:32px; border-radius:50%;
  }
  .cal-head button:hover{background:rgba(90,58,30,.08);}
  .cal-month{font-family:'Playfair Display',serif; font-weight:600; font-size:16px; text-transform:capitalize;}

  .cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:4px; text-align:center;}
  .cal-grid .wd{font-size:11px; color:var(--brown); opacity:.6; padding-bottom:4px;}
  .cal-day{
    aspect-ratio:1; display:flex; align-items:center; justify-content:center;
    border-radius:50%; font-size:13px; cursor:pointer; color:var(--ink);
    transition:all .15s ease;
  }
  .cal-day.disabled{opacity:.25; pointer-events:none;}
  .cal-day.empty{visibility:hidden;}
  .cal-day:not(.disabled):not(.empty):hover{background:rgba(217,164,65,.25);}
  .cal-day.selected{background:var(--navy-deep); color:var(--gold-hi); font-weight:600; box-shadow:0 0 0 3px var(--gold);}

  .time-label{font-size:12.5px; color:var(--brown); margin:16px 0 8px; text-transform:uppercase; letter-spacing:.6px;}
  .time-chips{display:flex; flex-wrap:wrap; gap:8px;}
  .chip{
    padding:8px 14px; border-radius:999px; border:1.5px solid rgba(90,58,30,.25);
    font-size:13.5px; cursor:pointer; background:rgba(255,255,255,.4); color:var(--ink);
    transition:all .15s ease;
  }
  .chip.selected{background:var(--navy-deep); color:var(--gold-hi); border-color:var(--navy-deep);}
  .chip.custom-toggle{border-style:dashed;}

  .custom-time{margin-top:10px; display:none;}
  .custom-time.show{display:block;}
  .custom-time input{
    font-family:'Poppins',sans-serif; font-size:14px; padding:8px 12px;
    border-radius:10px; border:1.5px solid rgba(90,58,30,.25); background:#fff;
  }

  .next-wrap{margin-top:22px; display:flex; justify-content:center;}

  /* ---------- SCREEN 3: places ---------- */
  .places-grid{
    display:grid; grid-template-columns:1fr 1fr; gap:12px; width:100%; max-width:360px;
  }
  .place-card{
    background:linear-gradient(160deg, rgba(250,243,226,.08), rgba(250,243,226,.03));
    border:1.5px solid rgba(250,243,226,.18);
    border-radius:18px;
    padding:18px 10px;
    text-align:center;
    cursor:pointer;
    transition:all .2s ease;
  }
  .place-card:nth-child(5){grid-column:1 / span 2; max-width:170px; margin:0 auto;}
  .place-card .ic{font-size:30px; display:block; margin-bottom:8px;}
  .place-card .lb{font-size:13.5px; color:var(--cream);}
  .place-card.selected{
    border-color:var(--gold);
    background:linear-gradient(160deg, rgba(244,185,66,.22), rgba(217,164,65,.08));
    box-shadow:0 0 0 2px var(--gold);
    transform:translateY(-2px);
  }

  /* ---------- SCREEN 4: confirmation ---------- */
  .seal{
    width:88px; height:88px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, var(--gold-hi), var(--gold) 60%, var(--sunflower-edge));
    display:flex; align-items:center; justify-content:center;
    font-size:38px;
    box-shadow:0 10px 24px rgba(217,164,65,.4);
    animation:sealPop .7s cubic-bezier(.3,1.6,.4,1) both;
    margin-bottom:6px;
  }
  @keyframes sealPop{0%{transform:scale(0) rotate(-20deg); opacity:0;}70%{transform:scale(1.1) rotate(6deg);}100%{transform:scale(1) rotate(0); opacity:1;}}

  .summary{
    width:100%; max-width:360px;
    background:linear-gradient(160deg, var(--cream), var(--cream-dim));
    color:var(--ink);
    border-radius:20px;
    padding:20px;
    margin-top:12px;
    box-shadow:0 14px 30px rgba(0,0,0,.35);
  }
  .summary-row{display:flex; justify-content:space-between; padding:9px 0; border-bottom:1px dashed rgba(90,58,30,.2); font-size:14px;}
  .summary-row:last-child{border-bottom:none;}
  .summary-row .k{color:var(--brown); opacity:.75;}
  .summary-row .v{font-weight:600; text-align:right;}

  .wa-btn{
    margin-top:22px;
    background:linear-gradient(135deg,#38d97f,#22b866);
    color:#0b2b1a;
    box-shadow:0 8px 20px rgba(34,184,102,.35);
  }

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.01ms !important; animation-iteration-count:1 !important; transition:none !important;}
  }
</style>
</head>
<body>

<div class="sky" id="sky">
  <div class="swirl s1"></div>
  <div class="swirl s2"></div>
  <div class="swirl s3"></div>
</div>

<div class="app">

  <div class="progress" id="progress">
    <div class="dot" data-step="2"></div>
    <div class="dot" data-step="3"></div>
    <div class="dot" data-step="4"></div>
  </div>

  <!-- SCREEN 1 — bouquet forming -->
  <section class="screen active" id="screen1">
    <div class="bouquet-wrap">
      <svg viewBox="0 0 320 400">
        <!-- stems -->
        <path class="stem" d="M160,300 C150,260 155,220 150,190" style="animation-delay:.1s"/>
        <path class="stem" d="M160,300 C168,255 165,215 172,185" style="animation-delay:.25s"/>
        <path class="stem" d="M160,300 C160,250 158,230 160,205" style="animation-delay:.4s"/>

        <!-- leaves -->
        <path class="leaf" d="M152,250 C130,245 118,258 112,275 C132,278 148,270 152,250 Z" style="animation-delay:1.0s"/>
        <path class="leaf" d="M168,235 C190,228 202,240 208,256 C188,260 172,253 168,235 Z" style="animation-delay:1.15s"/>
        <path class="leaf" d="M158,280 C140,285 130,300 132,315 C150,312 160,298 158,280 Z" style="animation-delay:1.3s"/>

        <!-- paper wrap -->
        <path class="paper" d="M95,400 L225,400 L205,300 C205,275 195,265 160,262 C125,265 115,275 115,300 Z" fill="#16305c" style="animation-delay:1.6s"/>
        <path class="paper-swirl" d="M120,380 C140,365 150,340 148,310" stroke="#6fa0d6" stroke-width="3" fill="none" stroke-linecap="round" style="animation-delay:2.0s"/>
        <path class="paper-swirl" d="M200,380 C182,362 172,338 176,308" stroke="#6fa0d6" stroke-width="3" fill="none" stroke-linecap="round" style="animation-delay:2.1s"/>
        <path class="paper-swirl" d="M160,395 C160,370 160,345 160,320" stroke="#8fb8e0" stroke-width="2" fill="none" stroke-linecap="round" style="animation-delay:2.2s"/>

        <!-- hydrangea puffs (blue) -->
        <g id="puffLayer"></g>

        <!-- sunflowers -->
        <g id="flowerLayer"></g>

        <!-- ribbon -->
        <g class="ribbon" style="animation-delay:2.35s">
          <path d="M160,268 C140,255 128,258 126,272 C124,288 145,292 160,278 Z" fill="#d9a441"/>
          <path d="M160,268 C180,255 192,258 194,272 C196,288 175,292 160,278 Z" fill="#e8b95c"/>
          <circle cx="160" cy="272" r="7" fill="#b9812a"/>
        </g>
      </svg>
    </div>

    <div class="message">
      <span class="line1">Espero muito te encontrar…</span>
      <span class="line2">mas quando e onde?</span>
    </div>

    <div class="cta">
      <button class="btn" onclick="goTo(2)">Vamos combinar 💫</button>
    </div>
  </section>

  <!-- SCREEN 2 — date & time -->
  <section class="screen" id="screen2">
    <button class="back-btn" onclick="goTo(1)">‹</button>
    <div class="title-block">
      <h2>Quando podemos nos ver?</h2>
      <div class="sub">escolha o dia e o horário</div>
    </div>

    <div class="card-panel">
      <div class="cal-head">
        <button onclick="changeMonth(-1)">‹</button>
        <div class="cal-month" id="calMonth"></div>
        <button onclick="changeMonth(1)">›</button>
      </div>
      <div class="cal-grid" id="calGrid"></div>

      <div class="time-label">Horário</div>
      <div class="time-chips" id="timeChips"></div>
      <div class="custom-time" id="customTimeBox">
        <input type="time" id="customTimeInput" onchange="selectCustomTime(this.value)">
      </div>
    </div>

    <div class="next-wrap">
      <button class="btn" id="btnToStep3" disabled onclick="goTo(3)">Continuar</button>
    </div>
  </section>

  <!-- SCREEN 3 — place -->
  <section class="screen" id="screen3">
    <button class="back-btn" onclick="goTo(2)">‹</button>
    <div class="title-block">
      <h2>Para onde vamos?</h2>
      <div class="sub">escolha o cenário do nosso encontro</div>
    </div>

    <div class="places-grid" id="placesGrid"></div>

    <div class="next-wrap">
      <button class="btn" id="btnToStep4" disabled onclick="goTo(4)">Continuar</button>
    </div>
  </section>

  <!-- SCREEN 4 — confirmation -->
  <section class="screen" id="screen4">
    <button class="back-btn" onclick="goTo(3)">‹</button>
    <div class="seal">🌻</div>
    <div class="title-block" style="margin-bottom:4px;">
      <h2>Só falta confirmar</h2>
      <div class="sub">e te mandar a resposta 💛</div>
    </div>

    <div class="summary" id="summaryBox"></div>

    <button class="btn wa-btn" onclick="sendWhatsapp()">Enviar no WhatsApp 💌</button>
  </section>

</div>

<script>
/* =========================================================
   CONFIGURAÇÃO — troque pelo seu número com DDI+DDD
   Ex: Brasil, SP, número 91234-5678 -> "5511912345678"
========================================================= */
const WHATSAPP_NUMBER = "55SEUNUMEROAQUI";

/* ---------------- state ---------------- */
const state = { date:null, dateLabel:null, time:null, place:null };

/* ---------------- background stars ---------------- */
(function makeStars(){
  const sky = document.getElementById('sky');
  const n = 55;
  for(let i=0;i<n;i++){
    const s = document.createElement('div');
    s.className='star';
    const size = Math.random()*2 + 1;
    s.style.width = size+'px';
    s.style.height = size+'px';
    s.style.left = Math.random()*100+'%';
    s.style.top = Math.random()*100+'%';
    s.style.animationDelay = (Math.random()*3.2)+'s';
    s.style.animationDuration = (2.4+Math.random()*2.4)+'s';
    sky.appendChild(s);
  }
})();

/* ---------------- bouquet: flowers + puffs ---------------- */
const SVGNS = "http://www.w3.org/2000/svg";
function makeFlower(cx, cy, scale, baseDelay){
  const g = document.createElementNS(SVGNS,'g');
  g.setAttribute('transform', `translate(${cx},${cy}) scale(${scale})`);
  const petals = 11;
  for(let i=0;i<petals;i++){
    const angle = (360/petals)*i;
    const p = document.createElementNS(SVGNS,'ellipse');
    p.setAttribute('cx', 0);
    p.setAttribute('cy', -26);
    p.setAttribute('rx', 8.5);
    p.setAttribute('ry', 17);
    p.setAttribute('class','petal');
    p.setAttribute('fill', i%3===0 ? 'var(--sunflower-dark)' : 'var(--sunflower)');
    p.setAttribute('transform', `rotate(${angle})`);
    p.style.animationDelay = (baseDelay + i*0.045)+'s';
    g.appendChild(p);
  }
  const center = document.createElementNS(SVGNS,'circle');
  center.setAttribute('cx',0); center.setAttribute('cy',0); center.setAttribute('r',12);
  center.setAttribute('fill','var(--brown)');
  center.setAttribute('class','fcenter');
  center.style.animationDelay = (baseDelay + petals*0.045 + 0.05)+'s';
  g.appendChild(center);
  for(let i=0;i<8;i++){
    const d = document.createElementNS(SVGNS,'circle');
    const a = Math.random()*Math.PI*2, r = Math.random()*7;
    d.setAttribute('cx', Math.cos(a)*r); d.setAttribute('cy', Math.sin(a)*r);
    d.setAttribute('r', 1.1);
    d.setAttribute('fill','#3a2410');
    d.setAttribute('class','fcenter');
    d.style.animationDelay = (baseDelay + petals*0.045 + 0.1)+'s';
    g.appendChild(d);
  }
  return g;
}
function makePuffCluster(cx, cy, count, baseDelay){
  const g = document.createElementNS(SVGNS,'g');
  const colors = ['#7fa6d6','#9db8dd','#6c93c4'];
  for(let i=0;i<count;i++){
    const a = Math.random()*Math.PI*2, r = Math.random()*16;
    const c = document.createElementNS(SVGNS,'circle');
    c.setAttribute('cx', cx + Math.cos(a)*r);
    c.setAttribute('cy', cy + Math.sin(a)*r*0.7);
    c.setAttribute('r', 3 + Math.random()*3);
    c.setAttribute('fill', colors[i%colors.length]);
    c.setAttribute('class','puff');
    c.style.animationDelay = (baseDelay + i*0.04)+'s';
    g.appendChild(c);
  }
  return g;
}

const flowerLayer = document.getElementById('flowerLayer');
const puffLayer = document.getElementById('puffLayer');
puffLayer.appendChild(makePuffCluster(112, 258, 9, 1.75));
puffLayer.appendChild(makePuffCluster(208, 240, 9, 1.85));
puffLayer.appendChild(makePuffCluster(160, 300, 7, 1.95));
flowerLayer.appendChild(makeFlower(150, 190, 1.05, 2.05));
flowerLayer.appendChild(makeFlower(172, 185, 0.95, 2.25));
flowerLayer.appendChild(makeFlower(160, 205, 0.8, 2.45));

/* ---------------- navigation ---------------- */
function goTo(step){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('screen'+step).classList.add('active');

  const prog = document.getElementById('progress');
  if(step >= 2){
    prog.classList.add('show');
    document.querySelectorAll('.dot').forEach(d=>{
      const ds = parseInt(d.dataset.step);
      d.classList.toggle('active', ds===step);
      d.classList.toggle('done', ds<step);
    });
  } else {
    prog.classList.remove('show');
  }
  if(step===4) renderSummary();
}

/* ---------------- calendar ---------------- */
const monthNames = ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
const weekDays = ["D","S","T","Q","Q","S","S"];
let viewDate = new Date();
viewDate.setDate(1);
const today = new Date(); today.setHours(0,0,0,0);

function renderCalendar(){
  document.getElementById('calMonth').textContent = monthNames[viewDate.getMonth()] + " " + viewDate.getFullYear();
  const grid = document.getElementById('calGrid');
  grid.innerHTML = '';
  weekDays.forEach(w=>{
    const el = document.createElement('div');
    el.className='wd'; el.textContent=w;
    grid.appendChild(el);
  });
  const firstDay = new Date(viewDate.getFullYear(), viewDate.getMonth(), 1).getDay();
  const daysInMonth = new Date(viewDate.getFullYear(), viewDate.getMonth()+1, 0).getDate();

  for(let i=0;i<firstDay;i++){
    const el = document.createElement('div');
    el.className='cal-day empty';
    grid.appendChild(el);
  }
  for(let d=1; d<=daysInMonth; d++){
    const el = document.createElement('div');
    el.className='cal-day';
    el.textContent = d;
    const thisDate = new Date(viewDate.getFullYear(), viewDate.getMonth(), d);
    thisDate.setHours(0,0,0,0);
    if(thisDate < today){
      el.classList.add('disabled');
    } else {
      el.onclick = ()=> selectDate(thisDate, el);
    }
    if(state.date && thisDate.getTime()===state.date.getTime()){
      el.classList.add('selected');
    }
    grid.appendChild(el);
  }
}
function changeMonth(delta){
  viewDate.setMonth(viewDate.getMonth()+delta);
  renderCalendar();
}
function selectDate(d, el){
  document.querySelectorAll('.cal-day.selected').forEach(x=>x.classList.remove('selected'));
  el.classList.add('selected');
  state.date = d;
  const wd = ["domingo","segunda-feira","terça-feira","quarta-feira","quinta-feira","sexta-feira","sábado"][d.getDay()];
  state.dateLabel = `${wd}, ${d.getDate()} de ${monthNames[d.getMonth()]}`;
  checkStep2();
}
renderCalendar();

/* ---------------- time chips ---------------- */
const times = ["18:00","18:30","19:00","19:30","20:00","20:30","21:00"];
const chipsWrap = document.getElementById('timeChips');
times.forEach(t=>{
  const c = document.createElement('div');
  c.className='chip'; c.textContent=t;
  c.onclick = ()=> selectTime(t, c);
  chipsWrap.appendChild(c);
});
const customChip = document.createElement('div');
customChip.className='chip custom-toggle';
customChip.textContent='Outro horário';
customChip.onclick = ()=>{
  document.getElementById('customTimeBox').classList.toggle('show');
};
chipsWrap.appendChild(customChip);

function selectTime(t, el){
  document.querySelectorAll('.chip').forEach(c=>c.classList.remove('selected'));
  el.classList.add('selected');
  state.time = t;
  checkStep2();
}
function selectCustomTime(v){
  if(!v) return;
  document.querySelectorAll('.chip').forEach(c=>c.classList.remove('selected'));
  state.time = v;
  checkStep2();
}
function checkStep2(){
  document.getElementById('btnToStep3').disabled = !(state.date && state.time);
}

/* ---------------- places ---------------- */
const places = [
  {icon:'🖼️', label:'Museu'},
  {icon:'🎭', label:'Teatro'},
  {icon:'🎬', label:'Cinema'},
  {icon:'🌇', label:'Pôr do sol'},
  {icon:'🌅', label:'Nascer do sol'}
];
const placesGrid = document.getElementById('placesGrid');
places.forEach(p=>{
  const el = document.createElement('div');
  el.className='place-card';
  el.innerHTML = `<span class="ic">${p.icon}</span><span class="lb">${p.label}</span>`;
  el.onclick = ()=>{
    document.querySelectorAll('.place-card').forEach(c=>c.classList.remove('selected'));
    el.classList.add('selected');
    state.place = p;
    document.getElementById('btnToStep4').disabled = false;
  };
  placesGrid.appendChild(el);
});

/* ---------------- confirmation ---------------- */
function renderSummary(){
  const box = document.getElementById('summaryBox');
  box.innerHTML = `
    <div class="summary-row"><span class="k">Data</span><span class="v">${state.dateLabel || '-'}</span></div>
    <div class="summary-row"><span class="k">Horário</span><span class="v">${state.time || '-'}</span></div>
    <div class="summary-row"><span class="k">Local</span><span class="v">${state.place ? state.place.icon+' '+state.place.label : '-'}</span></div>
  `;
}
function sendWhatsapp(){
  const msg = `💛 Recebi seu convite especial! 💛%0A%0A`+
    `Data: ${encodeURIComponent(state.dateLabel||'')}%0A`+
    `Horário: ${encodeURIComponent(state.time||'')}%0A`+
    `Local: ${encodeURIComponent((state.place?state.place.icon+' '+state.place.label:''))}%0A%0A`+
    `Mal posso esperar! 🌻`;
  window.location.href = `https://wa.me/${WHATSAPP_NUMBER}?text=${msg}`;
}
