<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Você é especial</title>

<!-- Only external resource used: a webfont, for the emotional typography of the final message. No external images are used — every visual element below is drawn with SVG/CSS/Canvas. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500;1,600&family=Jost:wght@300;400&display=swap" rel="stylesheet">

<style>
  /* ============================================================
     TOKENS — palette pulled straight from the reference artwork:
     a near-black violet void, glowing amethyst petals, a warm
     ivory throat, and deep emerald foliage.
     ============================================================ */
  :root{
    --void:        #050212;
    --void-2:      #0c0620;
    --nebula-1:    #2a0e52;
    --nebula-2:    #1b0a38;
    --petal-pale:  #f1e4ff;
    --petal-light: #d3aefc;
    --petal-mid:   #a879f2;
    --petal-deep:  #6f37c9;
    --petal-ink:   #4a1f96;
    --throat:      #fbf6ff;
    --stamen:      #ffe9a8;
    --leaf-hi:     #6fe08a;
    --leaf-mid:    #2fae5c;
    --leaf-dark:   #0f5a34;
    --foliage-1:   #7c3fd6;
    --foliage-2:   #582aa8;
    --foliage-3:   #34156b;
    --spark-warm:  #ffe9b0;
    --spark-cool:  #d9b6ff;
    --glow:        #b57bf5;
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0; padding:0; width:100%; height:100%;
    background:var(--void);
    overflow:hidden;
    -webkit-tap-highlight-color:transparent;
  }

  body{
    display:flex; align-items:center; justify-content:center;
    font-family:'Jost', sans-serif;
  }

  /* Full-bleed stage. Everything lives on top of each other:
     0) deep ambient glow (CSS)
     1) drifting light-mote canvas (JS)
     2) the SVG artwork (flowers/leaves)
     3) the closing message
  */
  #stage{
    position:relative;
    width:100vw; height:100dvh;
    overflow:hidden;
    background:radial-gradient(ellipse 120% 90% at 50% 115%, var(--nebula-1) 0%, var(--void-2) 45%, var(--void) 78%);
  }

  /* Soft breathing aura behind the whole scene — very subtle,
     it "reinforces the sense of enchantment" without stealing focus. */
  #aura{
    position:absolute; inset:0;
    background:radial-gradient(circle at 50% 62%, rgba(181,123,245,0.35) 0%, rgba(181,123,245,0.12) 30%, transparent 65%);
    opacity:0;
    animation:auraIn 3s ease-out forwards, auraBreathe 6s ease-in-out 3s infinite;
    pointer-events:none;
    mix-blend-mode:screen;
  }
  @keyframes auraIn{ to{ opacity:1; } }
  @keyframes auraBreathe{
    0%,100%{ transform:scale(1);   opacity:0.85; }
    50%    { transform:scale(1.08);opacity:1;    }
  }

  canvas#motes{
    position:absolute; inset:0; width:100%; height:100%;
    pointer-events:none;
  }

  #art-wrap{
    position:absolute; inset:0;
    display:flex; align-items:flex-end; justify-content:center;
    padding-bottom:2vh;
  }

  svg#art{
    width:min(92vw, 62vh, 560px);
    height:auto;
    max-height:92dvh;
    overflow:visible;
    filter:drop-shadow(0 0 40px rgba(150,90,230,0.25));
  }

  /* every drawable primitive starts invisible; JS reveals them
     in sequence so the composition "assembles itself" */
  .draw{
    stroke-dasharray: 1 1; /* real value is computed per-element in JS */
    stroke-dashoffset: 1;
  }
  .fade-pop{
    opacity:0;
    transform-box:fill-box;
    transform-origin:center;
    transform:scale(0.4);
  }
  .grow{
    opacity:0;
    transform-box:fill-box;
    transform-origin:bottom center;
    transform:scaleY(0.15);
  }

  /* ---------------- message ---------------- */
  #message{
    position:absolute;
    left:50%; top:50%;
    transform:translate(-50%,-46%);
    text-align:center;
    z-index:5;
    pointer-events:none;
    width:90vw;
  }

  #message-glow{
    position:absolute;
    left:50%; top:50%;
    width:120vmin; height:120vmin;
    transform:translate(-50%,-50%) scale(0.6);
    background:radial-gradient(circle, rgba(216,182,255,0.55) 0%, rgba(160,110,230,0.18) 32%, transparent 68%);
    opacity:0;
    filter:blur(4px);
    mix-blend-mode:screen;
    transition:opacity 1.8s ease-out, transform 2.2s cubic-bezier(.16,1,.3,1);
  }
  #message.show #message-glow{ opacity:1; transform:translate(-50%,-50%) scale(1); }

  #message h1{
    position:relative;
    margin:0;
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-weight:600;
    font-size:clamp(2.1rem, 8.5vw, 4.4rem);
    letter-spacing:0.16em;
    color:var(--petal-pale);
    line-height:1.25;
    filter:blur(14px);
    opacity:0;
    transform:translateY(22px);
    transition:
      opacity 1.7s cubic-bezier(.22,1,.36,1),
      filter 1.7s cubic-bezier(.22,1,.36,1),
      transform 1.7s cubic-bezier(.22,1,.36,1),
      letter-spacing 1.9s cubic-bezier(.22,1,.36,1);

    background:linear-gradient(100deg,
      var(--petal-pale) 0%, var(--petal-pale) 35%,
      #ffffff 48%,
      var(--petal-pale) 61%, var(--petal-pale) 100%);
    background-size:260% 100%;
    background-position:0% 0%;
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
    text-shadow:0 0 46px rgba(216,182,255,0.55);
  }

  #message.show h1{
    opacity:1;
    filter:blur(0px);
    transform:translateY(0);
    letter-spacing:0.04em;
    animation:shimmer 4.5s ease-in-out 1.9s infinite, floatMsg 6s ease-in-out 1.9s infinite;
  }
  @keyframes shimmer{
    0%   { background-position:0% 0%; }
    50%  { background-position:100% 0%; }
    100% { background-position:0% 0%; }
  }
  @keyframes floatMsg{
    0%,100%{ transform:translateY(0px); }
    50%    { transform:translateY(-8px); }
  }

  /* thin light rule that draws itself under the message, like a
     brushstroke of underline — a quiet, single deliberate flourish */
  #message .rule{
    display:block;
    margin:0.9em auto 0;
    width:0;
    height:1px;
    background:linear-gradient(90deg, transparent, var(--petal-light), transparent);
    transition:width 1.4s cubic-bezier(.22,1,.36,1) 1.1s, opacity 1.4s ease 1.1s;
    opacity:0;
  }
  #message.show .rule{ width:min(220px, 46vw); opacity:0.9; }

  @media (prefers-reduced-motion: reduce){
    #message.show h1{ animation:none; }
    #aura{ animation:auraIn 1.2s ease-out forwards; }
  }
</style>
</head>
<body>

<div id="stage">
  <div id="aura"></div>
  <canvas id="motes"></canvas>

  <div id="art-wrap">
    <!-- ============================================================
         The artwork. ViewBox is a tall portrait canvas mirroring the
         reference photo's framing: three amethyst blooms rising out
         of a bed of deep-violet foliage, flanked by tall grass, all
         glowing softly against the dark.
         ============================================================ -->
    <svg id="art" viewBox="0 0 600 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Três flores roxas brilhantes desabrochando sobre um fundo escuro">
      <defs>
        <radialGradient id="gGround" cx="50%" cy="100%" r="75%">
          <stop offset="0%" stop-color="#5a2fb0" stop-opacity="0.55"/>
          <stop offset="45%" stop-color="#2a1160" stop-opacity="0.25"/>
          <stop offset="100%" stop-color="#2a1160" stop-opacity="0"/>
        </radialGradient>

        <linearGradient id="gBlade" x1="0" y1="1" x2="0" y2="0">
          <stop offset="0%"  stop-color="var(--leaf-dark)"/>
          <stop offset="55%" stop-color="var(--leaf-mid)"/>
          <stop offset="100%" stop-color="var(--leaf-hi)"/>
        </linearGradient>

        <linearGradient id="gFoliage" x1="0" y1="1" x2="0" y2="0">
          <stop offset="0%"  stop-color="var(--foliage-3)"/>
          <stop offset="55%" stop-color="var(--foliage-2)"/>
          <stop offset="100%" stop-color="var(--foliage-1)"/>
        </linearGradient>

        <linearGradient id="gStem" x1="0" y1="1" x2="0" y2="0">
          <stop offset="0%"  stop-color="var(--petal-ink)"/>
          <stop offset="100%" stop-color="var(--petal-mid)"/>
        </linearGradient>

        <radialGradient id="gPetal" cx="50%" cy="90%" r="90%">
          <stop offset="0%"  stop-color="var(--petal-pale)"/>
          <stop offset="45%" stop-color="var(--petal-light)"/>
          <stop offset="100%" stop-color="var(--petal-deep)"/>
        </radialGradient>

        <radialGradient id="gBell" cx="50%" cy="0%" r="100%">
          <stop offset="0%"  stop-color="var(--petal-mid)"/>
          <stop offset="100%" stop-color="var(--petal-ink)"/>
        </radialGradient>

        <radialGradient id="gThroat" cx="50%" cy="50%" r="50%">
          <stop offset="0%"  stop-color="#ffffff"/>
          <stop offset="70%" stop-color="var(--throat)"/>
          <stop offset="100%" stop-color="var(--petal-light)" stop-opacity="0"/>
        </radialGradient>

        <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
          <feGaussianBlur stdDeviation="6" result="b"/>
          <feMerge>
            <feMergeNode in="b"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>

        <filter id="wideGlow" x="-150%" y="-150%" width="400%" height="400%">
          <feGaussianBlur stdDeviation="14"/>
        </filter>
      </defs>

      <!-- ambient ground glow, the very first thing to appear -->
      <ellipse id="groundGlow" cx="300" cy="815" rx="230" ry="90" fill="url(#gGround)" opacity="0"/>

      <!-- ===================== GRASS BLADES ===================== -->
      <g id="grass" fill="url(#gBlade)" filter="url(#softGlow)"></g>

      <!-- ===================== PURPLE FOLIAGE ===================== -->
      <g id="foliage" filter="url(#softGlow)"></g>

      <!-- ===================== STEMS ===================== -->
      <g id="stems" fill="none" stroke="url(#gStem)" stroke-width="6" stroke-linecap="round"></g>

      <!-- ===================== FLOWERS (populated by JS) ===================== -->
      <g id="flowers"></g>

    </svg>
  </div>

  <div id="message">
    <h1>Você é especial</h1>
    <span class="rule"></span>
  </div>
</div>

<script>
(function(){
  "use strict";

  /* ---------------------------------------------------------------
     Respect the user's motion preference: if they've asked for
     reduced motion, we still tell the story, just calmly — one
     gentle fade instead of a long choreographed sequence.
  --------------------------------------------------------------- */
  const REDUCE = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const svgNS = "http://www.w3.org/2000/svg";
  const $ = (sel, ctx) => (ctx || document).querySelector(sel);
  const grassG   = $('#grass');
  const foliageG = $('#foliage');
  const stemsG   = $('#stems');
  const flowersG = $('#flowers');

  const wait = (ms) => new Promise(res => setTimeout(res, ms));

  function el(tag, attrs){
    const node = document.createElementNS(svgNS, tag);
    for(const k in attrs) node.setAttribute(k, attrs[k]);
    return node;
  }

  /* =================================================================
     GEOMETRY GENERATORS
     Small deterministic helpers that build the organic shapes
     (blades of grass, foliage blobs, petals) as SVG path strings,
     so the composition stays hand-art-directed rather than random.
  ================================================================= */

  // A tapered blade of grass rising from (x, baseY) to height h,
  // leaning sideways by `lean` px at the tip, bowing by `bow`.
  function bladePath(x, baseY, h, lean, bow, width){
    const tipX = x + lean, tipY = baseY - h;
    const midY = baseY - h * 0.55;
    const c1x = x + bow, c1y = baseY - h * 0.3;
    const c2x = tipX - bow * 0.4, c2y = midY;
    return `M ${x - width/2},${baseY}
            C ${c1x - width/2},${c1y} ${c2x - width/2},${c2y} ${tipX},${tipY}
            C ${c2x + width/2},${c2y} ${c1x + width/2},${c1y} ${x + width/2},${baseY} Z`;
  }

  // A soft organic leaf-blob used to build the violet foliage clump.
  function leafBlob(cx, cy, w, h, rot){
    const d = `M 0,0
      C ${-w*0.55},${-h*0.15} ${-w*0.5},${-h*0.85} 0,${-h}
      C ${w*0.5},${-h*0.85} ${w*0.55},${-h*0.15} 0,0 Z`;
    return { d, transform:`translate(${cx},${cy}) rotate(${rot})` };
  }

  // A single flower petal, drawn pointing straight up from the
  // flower's core, meant to be fanned out with a rotate() transform.
  function petalPath(){
    return `M 0,0
      C -16,-14 -21,-42 -11,-70
      C -6,-86 6,-86 11,-70
      C 21,-42 16,-14 0,0 Z`;
  }

  /* =================================================================
     BUILD: GRASS
  ================================================================= */
  const bladeSpecs = [
    // [x, baseY, height, lean, bow, width]
    [96,  832, 300,  10, 18, 14],
    [128, 838, 380, -18, 26, 16],
    [160, 836, 260,  22, 14, 11],
    [188, 840, 430, -8, 30, 18],
    [214, 834, 200,  16, 10, 10],

    [404, 838, 210, -14, 12, 10],
    [430, 834, 400,  16, 28, 17],
    [458, 840, 300, -20, 18, 13],
    [486, 836, 360,  12, 24, 15],
    [512, 830, 230, -10, 12, 11],
  ];

  const bladeEls = bladeSpecs.map(spec => {
    const p = el('path', { d: bladePath(...spec), opacity:'0', class:'blade' });
    grassG.appendChild(p);
    return p;
  });

  /* =================================================================
     BUILD: FOLIAGE (the violet leaf clump at the base of the blooms)
  ================================================================= */
  const foliageSpecs = [
    [244, 828, 120, 210, -18],
    [300, 838, 130, 230,   4],
    [356, 826, 118, 200,  22],
    [212, 822,  90, 150, -34],
    [388, 820,  92, 155,  32],
    [270, 812,  80, 130, -6],
    [332, 812,  80, 128,   9],
  ];

  const foliageEls = foliageSpecs.map((spec, i) => {
    const [cx, cy, w, h, rot] = spec;
    const shape = leafBlob(cx, cy, w, h, rot);
    const p = el('path', {
      d: shape.d, transform: shape.transform,
      fill: 'url(#gFoliage)', class:'fade-pop foliage-leaf'
    });
    foliageG.appendChild(p);
    return p;
  });

  /* =================================================================
     BUILD: STEMS + FLOWERS
  ================================================================= */
  const blooms = [
    { base:[300, 812], tip:[300, 232], curve:[300, 520], scale:1.18, rot:0   },
    { base:[224, 818], tip:[196, 318], curve:[190, 560], scale:0.86, rot:-9  },
    { base:[372, 820], tip:[398, 356], curve:[404, 580], scale:0.80, rot:11  },
  ];

  const stemEls = [];
  const flowerGroups = [];

  blooms.forEach((b, i) => {
    const [bx,by] = b.base, [tx,ty] = b.tip, [cx,cy] = b.curve;
    const d = `M ${bx},${by} Q ${cx},${cy} ${tx},${ty}`;
    const stem = el('path', { d, opacity:'0', class:'stem' });
    stemsG.appendChild(stem);
    stemEls.push(stem);

    // flower group, positioned + oriented at the stem tip
    const g = el('g', {
      transform:`translate(${tx},${ty}) rotate(${b.rot}) scale(${b.scale})`,
      opacity:'0'
    });

    // bell / sepal base sitting just beneath the petals
    const bell = el('path', {
      d:'M -30,10 C -30,34 -16,52 0,52 C 16,52 30,34 30,10 C 30,-4 -30,-4 -30,10 Z',
      fill:'url(#gBell)', class:'bell fade-pop'
    });
    g.appendChild(bell);

    // petals, fanned around the core
    const petalAngles = [-58, -29, 0, 29, 58];
    const petalEls = petalAngles.map(a => {
      const p = el('path', {
        d: petalPath(),
        transform:`rotate(${a})`,
        fill:'url(#gPetal)',
        class:'fade-pop petal'
      });
      g.appendChild(p);
      return p;
    });

    // soft under-glow disc for the bloom (adds the neon "backlit" feel)
    const halo = el('circle', {
      cx:0, cy:-18, r:46, fill:'var(--glow)', opacity:'0',
      filter:'url(#wideGlow)', class:'halo'
    });
    g.insertBefore(halo, bell);

    // throat + stamen
    const throat = el('ellipse', { cx:0, cy:-14, rx:15, ry:11, fill:'url(#gThroat)', class:'fade-pop' });
    g.appendChild(throat);
    const stamen = el('circle', { cx:0, cy:-18, r:4.2, fill:'var(--stamen)', class:'fade-pop' });
    g.appendChild(stamen);

    flowersG.appendChild(g);
    flowerGroups.push({ g, petalEls, bell, throat, stamen, halo });
  });

  /* =================================================================
     ANIMATION HELPERS
  ================================================================= */

  // Prepares a path for a "drawing" (stroke reveal) animation by
  // measuring its real rendered length, so the dash math is exact.
  function primeDraw(pathEl){
    const len = pathEl.getTotalLength();
    pathEl.style.strokeDasharray = `${len}`;
    pathEl.style.strokeDashoffset = `${len}`;
    pathEl.style.opacity = '1';
    return len;
  }

  function animateDraw(pathEl, duration){
    return new Promise(resolve => {
      const len = primeDraw(pathEl);
      pathEl.animate(
        [{ strokeDashoffset: len }, { strokeDashoffset: 0 }],
        { duration, easing:'cubic-bezier(.22,1,.36,1)', fill:'forwards' }
      ).onfinish = resolve;
    });
  }

  function animatePop(elm, duration, opts){
    opts = opts || {};
    const scaleFrom = opts.scaleFrom ?? 0.35;
    return new Promise(resolve => {
      elm.style.opacity = '1';
      elm.animate(
        [
          { opacity:0, transform:`scale(${scaleFrom})` },
          { opacity:1, transform:'scale(1.08)', offset:0.72 },
          { opacity:1, transform:'scale(1)' }
        ],
        { duration, easing:'cubic-bezier(.22,1,.36,1)', fill:'forwards' }
      ).onfinish = resolve;
    });
  }

  function animateGrow(elm, duration){
    return new Promise(resolve => {
      elm.style.opacity = '1';
      elm.animate(
        [
          { opacity:0, transform:'scaleY(0.2)' },
          { opacity:1, transform:'scaleY(1)' }
        ],
        { duration, easing:'cubic-bezier(.2,.9,.3,1)', fill:'forwards' }
      ).onfinish = resolve;
    });
  }

  function pulse(elm, peakOpacity, duration){
    return new Promise(resolve => {
      elm.animate(
        [{ opacity:0 }, { opacity:peakOpacity, offset:0.4 }, { opacity:peakOpacity*0.6 }],
        { duration, easing:'ease-out', fill:'forwards' }
      ).onfinish = resolve;
    });
  }

  /* =================================================================
     CANVAS — drifting light motes (pollen / fireflies / sparkle dust)
     Continues gently forever, density scaled to the viewport so
     modest phones stay smooth and near 60fps.
  ================================================================= */
  const canvas = $('#motes');
  const ctx = canvas.getContext('2d');
  let W, H, DPR;
  let motes = [];
  let sparkBudget = 0; // one-off sparkle bursts queued by the bloom sequence

  function sizeCanvas(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = canvas.clientWidth = window.innerWidth;
    H = canvas.clientHeight = window.innerHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }

  function makeMote(spawnLow){
    const area = W * H;
    return {
      x: Math.random() * W,
      y: spawnLow ? H + Math.random()*40 : Math.random()*H,
      r: Math.random() * 1.6 + 0.6,
      speed: Math.random() * 18 + 8,      // px/sec upward
      drift: (Math.random() - 0.5) * 10,  // horizontal sway px/sec
      phase: Math.random() * Math.PI * 2,
      warmth: Math.random(), // 0 = cool violet, 1 = warm gold
      life: 0
    };
  }

  function initMotes(){
    const area = W * H;
    const count = REDUCE ? 0 : Math.max(18, Math.min(90, Math.floor(area / 13000)));
    motes = new Array(count).fill(0).map(() => makeMote(false));
  }

  let lastT = performance.now();
  function tickMotes(now){
    const dt = Math.min(0.05, (now - lastT) / 1000);
    lastT = now;
    ctx.clearRect(0,0,W,H);

    for(const m of motes){
      m.life += dt;
      m.y -= m.speed * dt;
      m.x += Math.sin(m.life * 1.2 + m.phase) * m.drift * dt;
      if(m.y < -10){ Object.assign(m, makeMote(true)); }

      const twinkle = 0.5 + 0.5 * Math.sin(m.life * 2.2 + m.phase);
      const alpha = 0.15 + twinkle * 0.55;
      const color = m.warmth > 0.6 ? '255,233,176' : '216,182,255';

      ctx.beginPath();
      const grad = ctx.createRadialGradient(m.x, m.y, 0, m.x, m.y, m.r*4);
      grad.addColorStop(0, `rgba(${color},${alpha})`);
      grad.addColorStop(1, `rgba(${color},0)`);
      ctx.fillStyle = grad;
      ctx.arc(m.x, m.y, m.r*4, 0, Math.PI*2);
      ctx.fill();

      ctx.beginPath();
      ctx.fillStyle = `rgba(${color},${Math.min(1,alpha+0.25)})`;
      ctx.arc(m.x, m.y, m.r, 0, Math.PI*2);
      ctx.fill();
    }

    requestAnimationFrame(tickMotes);
  }

  sizeCanvas();
  initMotes();
  requestAnimationFrame(tickMotes);
  window.addEventListener('resize', () => { sizeCanvas(); initMotes(); });

  /* =================================================================
     THE MAGIC — orchestrated formation sequence
  ================================================================= */
  async function bloomOneFlower(fg, stemEl, stemDur){
    await animateDraw(stemEl, stemDur);
    await animatePop(fg.g.parentElement === flowersG ? fg.g : fg.g, 1); // no-op guard
    fg.g.style.opacity = '1';
    await pulse(fg.halo, 0.55, 900);
    await animatePop(fg.bell, 420, { scaleFrom:0.5 });
    for(let i=0;i<fg.petalEls.length;i++){
      animatePop(fg.petalEls[i], 520, { scaleFrom:0.2 });
      await wait(85);
    }
    await wait(160);
    animatePop(fg.throat, 380, { scaleFrom:0.3 });
    await wait(90);
    animatePop(fg.stamen, 320, { scaleFrom:0.2 });
    await wait(200);
  }

  async function runSequence(){
    // 1) the ground softly ignites — the "planting" moment
    await pulse($('#groundGlow'), 1, 1400);

    // 2) grass rises out of the dark, staggered
    const grassPromises = bladeEls.map((b, i) => wait(i*70).then(() => animateDraw(b, 850)));
    await wait(300);

    // 3) violet foliage blooms open beneath where the flowers will stand
    foliageEls.forEach((f, i) => wait(i*90).then(() => animatePop(f, 620)));

    await Promise.all(grassPromises);
    await wait(150);

    // 4) each stem climbs, then its flower unfurls — center first,
    //    like the composition is finding its balance outward
    const order = [0,1,2];
    for(const idx of order){
      await bloomOneFlower(flowerGroups[idx], stemEls[idx], 780);
    }

    // 5) let the fully formed scene breathe for a moment
    await wait(1100);

    // 6) reveal the message
    $('#message').classList.add('show');
  }

  async function runReduced(){
    // One calm, single fade for people who prefer minimal motion.
    $('#groundGlow').style.transition = 'opacity 1s ease';
    $('#groundGlow').style.opacity = '1';

    [...bladeEls, ...foliageEls].forEach(elx => { elx.style.transition = 'opacity 1s ease'; elx.style.opacity='1'; primeSimple(elx); });
    stemEls.forEach(s => { primeDraw(s); s.style.transition='stroke-dashoffset 1s ease'; requestAnimationFrame(()=> s.style.strokeDashoffset='0'); });
    flowerGroups.forEach(fg => {
      fg.g.style.transition = 'opacity 1s ease';
      fg.g.style.opacity = '1';
      [fg.bell, ...fg.petalEls, fg.throat, fg.stamen].forEach(x=>{ x.style.transition='opacity 1s ease'; x.style.opacity='1'; });
      fg.halo.style.opacity = '0.35';
    });

    function primeSimple(elx){ elx.style.transform = 'none'; }

    await wait(1400);
    $('#message').classList.add('show');
  }

  // Kick off once the page has settled.
  window.addEventListener('load', () => {
    if(REDUCE){ runReduced(); } else { runSequence(); }
  });

})();
</script>
</body>
</html>
