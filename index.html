<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Um convite especial 🌸</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,600&family=Dancing+Script:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy-deep:#070512;
    --navy-mid:#0f0b24;
    --navy-hi:#1a123a;
    --swirl:#3b1d70;
    --flower-light:#f3e8ff;
    --flower-mid:#c084fc;
    --flower-dark:#7e22ce;
    --flower-center:#fef08a;
    --flower-glow:#a855f7;
    --leaf:#9333ea;
    --leaf-dark:#4c1d95;
    --grass-green:#22c55e;
    --berry:#6b21a8;
    --cream:#faf3e2;
    --cream-dim:#efe4c9;
    --gold:#d9a441;
    --gold-hi:#f1c876;
    --ink:#241e0f;
    --brown:#5a3a1e;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:'Poppins',sans-serif;
    background:var(--navy-deep);
    color:var(--cream);
    overflow:hidden;
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  /* ---------- background: starry night ---------- */
  .sky{
    position:fixed; inset:0;
    background:
      radial-gradient(ellipse at 20% 15%, rgba(59,29,112,.5), transparent 55%),
      radial-gradient(ellipse at 80% 70%, rgba(26,18,58,.6), transparent 60%),
      linear-gradient(160deg, var(--navy-deep) 0%, var(--navy-mid) 55%, var(--navy-deep) 100%);
    overflow:hidden;
    z-index:0;
  }
  .swirl{
    position:absolute;
    border-radius:50%;
    filter:blur(18px);
    opacity:.3;
    background:conic-gradient(from 0deg, var(--swirl), transparent 40%, var(--navy-hi) 60%, transparent 90%);
    animation:swirlRotate 50s linear infinite;
  }
  .swirl.s1{width:340px; height:340px; top:-80px; left:-90px; animation-duration:70s;}
  .swirl.s2{width:260px; height:260px; bottom:-60px; right:-70px; animation-duration:55s; animation-direction:reverse;}
  .swirl.s3{width:200px; height:200px; top:40%; left:60%; animation-duration:40s;}
  @keyframes swirlRotate{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}

  .star{
    position:absolute;
    background:#fff7dd;
    border-radius:50%;
    animation:twinkle 3.2s ease-in-out infinite;
  }
  @keyframes twinkle{0%,100%{opacity:.15;}50%{opacity:1;}}

  /* ---------- app shell ---------- */
  .app{
    position:relative;
    z-index:1;
    width:100%;
    max-width:430px;
    height:100vh;
    height:100dvh;
    max-height:900px;
    display:flex;
    flex-direction:column;
    padding:0;
  }

  .progress{
    display:none;
    align-items:center;
    justify-content:center;
    gap:8px;
    padding:18px 0 6px;
    z-index:3;
  }
  .progress.show{display:flex;}
  .dot{width:7px; height:7px; border-radius:50%; background:rgba(250,243,226,.25); transition:all .35s ease;}
  .dot.active{background:var(--gold-hi); width:20px; border-radius:5px;}
  .dot.done{background:var(--gold);}

  .back-btn{
    position:absolute;
    top:16px; left:14px;
    z-index:5;
    background:rgba(250,243,226,.1);
    border:1px solid rgba(250,243,226,.25);
    color:var(--cream);
    width:36px; height:36px;
    border-radius:50%;
    font-size:16px;
    display:none;
    align-items:center;
    justify-content:center;
    cursor:pointer;
  }
  .screen.active .back-btn{display:flex;}

  .screen{
    display:none;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    flex:1;
    width:100%;
    padding:14px 24px 28px;
    position:relative;
    overflow-y:auto;
  }
  .screen.active{display:flex;}
  .screen.active > *{animation:fadeUp .7s ease both;}

  @keyframes fadeUp{
    0%{opacity:0; transform:translateY(16px);}
    100%{opacity:1; transform:translateY(0);}
  }

  h1,h2{font-family:'Playfair Display',serif; margin:0;}

  /* ---------- SCREEN 1: bouquet ---------- */
  #screen1{justify-content:center; padding-top:0;}
  .bouquet-wrap{
    width:100%;
    max-width:320px;
    aspect-ratio:4/5;
    animation:none !important;
  }
  .bouquet-wrap svg{width:100%; height:100%; overflow:visible;}

  .stem{
    fill:none;
    stroke:var(--leaf-dark);
    stroke-width:3.5;
    stroke-linecap:round;
    stroke-dasharray:300;
    stroke-dashoffset:300;
    animation:drawStem 1.1s ease forwards;
  }
  @keyframes drawStem{to{stroke-dashoffset:0;}}

  .blade{
    fill:var(--grass-green);
    opacity:0;
    transform-box:fill-box;
    transform-origin:bottom center;
    animation:bladeGrow .9s cubic-bezier(.2,.8,.3,1.05) forwards;
  }
  @keyframes bladeGrow{
    0%{opacity:0; transform:scaleY(0) scaleX(.6);}
    100%{opacity:0.85; transform:scaleY(1) scaleX(1);}
  }

  .leaf{
    fill:var(--leaf);
    opacity:0;
    transform-box:fill-box;
    transform-origin:center;
    animation:leafPop .6s ease forwards;
  }
  @keyframes leafPop{
    0%{opacity:0; transform:scale(0) rotate(-14deg);}
    70%{opacity:1;}
    100%{opacity:1; transform:scale(1) rotate(0deg);}
  }

  .berry{
    fill:var(--berry);
    opacity:0;
    transform-box:fill-box;
    transform-origin:center;
    animation:puffPop .45s ease forwards;
  }
  @keyframes puffPop{
    0%{opacity:0; transform:scale(0);}
    100%{opacity:1; transform:scale(1);}
  }

  .petal{
    opacity:0;
    transform-box:fill-box;
    transform-origin:center;
    animation:petalPop .6s cubic-bezier(.3,1.4,.5,1) forwards;
  }
  @keyframes petalPop{
    0%{opacity:0; transform:scale(0);}
    65%{opacity:0.9; transform:scale(1.1);}
    100%{opacity:0.85; transform:scale(1);}
  }
  
  .fcenter{
    opacity:0;
    transform-box:fill-box;
    transform-origin:center;
    animation:centerPop .5s ease forwards;
  }
  @keyframes centerPop{
    0%{opacity:0; transform:scale(0); filter:blur(4px);}
    100%{opacity:1; transform:scale(1); filter:blur(0px);}
  }

  .magic-particle {
    opacity:0;
    animation:floatParticle 2.5s ease-in-out infinite alternate;
  }
  @keyframes floatParticle {
    0% { opacity:0; transform: translate(0, 0) scale(0.5); }
    20% { opacity:1; }
    100% { opacity:0; transform: translate(var(--mx), var(--my)) scale(1.2); }
  }

  .message{
    text-align:center;
    margin-top:6px;
  }
  .message .line1{
    font-family:'Dancing Script',cursive;
    font-size:clamp(26px,7vw,34px);
    color:var(--gold-hi);
    opacity:0;
    animation:fadeUp .8s ease forwards;
    animation-delay:2.6s;
    display:block;
  }
  .message .line2{
    font-family:'Playfair Display',serif;
    font-style:italic;
    font-size:clamp(17px,4.6vw,20px);
    color:var(--cream);
    opacity:.92;
    margin-top:6px;
    opacity:0;
    animation:fadeUp .8s ease forwards;
    animation-delay:3.3s;
    display:block;
  }
  .cta{
    opacity:0;
    animation:fadeUp .8s ease forwards;
    animation-delay:4s;
    margin-top:20px;
  }

  /* ---------- buttons ---------- */
  .btn{
    font-family:'Poppins',sans-serif;
    font-weight:500;
    font-size:15px;
    letter-spacing:.3px;
    border:none;
    border-radius:999px;
    padding:14px 30px;
    background:linear-gradient(135deg, var(--gold-hi), var(--gold));
    color:#2a1c05;
    cursor:pointer;
    box-shadow:0 6px 18px rgba(217,164,65,.35);
    transition:transform .2s ease, box-shadow .2s ease, opacity .2s ease;
  }
  .btn:active{transform:scale(.96);}
  .btn:disabled{opacity:.35; box-shadow:none; cursor:not-allowed;}

  /* ---------- SCREEN 2: calendar ---------- */
  .title-block{text-align:center; margin-bottom:18px;}
  .title-block h2{font-size:clamp(21px,5.5vw,26px); color:var(--cream);}
  .title-block .sub{font-size:13px; color:var(--gold-hi); font-style:italic; font-family:'Playfair Display',serif; margin-top:4px;}

  .card-panel{
    background:linear-gradient(160deg, var(--cream), var(--cream-dim));
    color:var(--ink);
    border-radius:22px;
    padding:18px 16px;
    width:100%;
    max-width:360px;
    box-shadow:0 14px 30px rgba(0,0,0,.35);
  }

  .cal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
  .cal-head button{
    background:none; border:none; font-size:18px; color:var(--brown); cursor:pointer;
    width:32px; height:32px; border-radius:50%;
  }
  .cal-month{font-family:'Playfair Display',serif; font-weight:600; font-size:16px; text-transform:capitalize;}

  .cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:4px; text-align:center;}
  .cal-grid .wd{font-size:11px; color:var(--brown); opacity:.6; padding-bottom:4px;}
  .cal-day{
    aspect-ratio:1; display:flex; align-items:center; justify-content:center;
    border-radius:50%; font-size:13px; cursor:pointer; color:var(--ink);
    transition:all .15s ease;
  }
  .cal-day.disabled{opacity:.25; pointer-events:none;}
  .cal-day.empty{visibility:hidden;}
  .cal-day:not(.disabled):not(.empty):hover{background:rgba(217,164,65,.25);}
  .cal-day.selected{background:var(--navy-deep); color:var(--gold-hi); font-weight:600; box-shadow:0 0 0 3px var(--gold);}

  .time-label{font-size:12.5px; color:var(--brown); margin:16px 0 8px; text-transform:uppercase; letter-spacing:.6px;}
  .time-chips{
    display:grid; 
    grid-template-columns:repeat(3, 1fr); 
    gap:8px;
    max-height:180px;
    overflow-y:auto;
  }
  .chip{
    padding:8px 10px; border-radius:999px; border:1.5px solid rgba(90,58,30,.25);
    font-size:13px; cursor:pointer; background:rgba(255,255,255,.4); color:var(--ink);
    text-align:center;
    transition:all .15s ease;
  }
  .chip.selected{background:var(--navy-deep); color:var(--gold-hi); border-color:var(--navy-deep);}

  .next-wrap{margin-top:22px; display:flex; justify-content:center;}

  /* ---------- SCREEN 3: places ---------- */
  .places-grid{
    display:grid; grid-template-columns:1fr 1fr; gap:12px; width:100%; max-width:360px;
  }
  .place-card{
    background:linear-gradient(160deg, rgba(250,243,226,.08), rgba(250,243,226,.03));
    border:1.5px solid rgba(250,243,226,.18);
    border-radius:18px;
    padding:18px 10px;
    text-align:center;
    cursor:pointer;
    transition:all .2s ease;
  }
  .place-card:nth-child(5){grid-column:1 / span 2; max-width:170px; margin:0 auto;}
  .place-card .ic{font-size:30px; display:block; margin-bottom:8px;}
  .place-card .lb{font-size:13.5px; color:var(--cream);}
  .place-card.selected{
    border-color:var(--gold);
    background:linear-gradient(160deg, rgba(244,185,66,.22), rgba(217,164,65,.08));
    box-shadow:0 0 0 2px var(--gold);
    transform:translateY(-2px);
  }

  /* ---------- SCREEN 4: confirmation ---------- */
  .seal{
    width:88px; height:88px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, var(--flower-light), var(--flower-mid) 60%, var(--flower-dark));
    display:flex; align-items:center; justify-content:center;
    font-size:38px;
    box-shadow:0 10px 24px rgba(168,85,247,.4);
    animation:sealPop .7s cubic-bezier(.3,1.6,.4,1) both;
    margin-bottom:6px;
  }
  @keyframes sealPop{0%{transform:scale(0) rotate(-20deg); opacity:0;}70%{transform:scale(1.1) rotate(6deg);}100%{transform:scale(1) rotate(0); opacity:1;}}

  .summary{
    width:100%; max-width:360px;
    background:linear-gradient(160deg, var(--cream), var(--cream-dim));
    color:var(--ink);
    border-radius:20px;
    padding:20px;
    margin-top:12px;
    box-shadow:0 14px 30px rgba(0,0,0,.35);
  }
  .summary-row{display:flex; justify-content:space-between; padding:9px 0; border-bottom:1px dashed rgba(90,58,30,.2); font-size:14px;}
  .summary-row:last-child{border-bottom:none;}
  .summary-row .k{color:var(--brown); opacity:.75;}
  .summary-row .v{font-weight:600; text-align:right;}

  .wa-btn{
    margin-top:22px;
    background:linear-gradient(135deg,#38d97f,#22b866);
    color:#0b2b1a;
    box-shadow:0 8px 20px rgba(34,184,102,.35);
  }
</style>
</head>
<body>

<div class="sky" id="sky">
  <div class="swirl s1"></div>
  <div class="swirl s2"></div>
  <div class="swirl s3"></div>
</div>

<div class="app">

  <div class="progress" id="progress">
    <div class="dot" data-step="2"></div>
    <div class="dot" data-step="3"></div>
    <div class="dot" data-step="4"></div>
  </div>

  <section class="screen active" id="screen1">
    <div class="bouquet-wrap">
      <svg viewBox="0 0 320 400">
        <defs>
          <radialGradient id="purplePetalGrad" cx="50%" cy="100%" r="90%">
            <stop offset="0%" stop-color="var(--flower-light)"/>
            <stop offset="55%" stop-color="var(--flower-mid)"/>
            <stop offset="100%" stop-color="var(--flower-dark)"/>
          </radialGradient>
          <radialGradient id="glowCenterGrad" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#ffffff"/>
            <stop offset="40%" stop-color="var(--flower-center)"/>
            <stop offset="85%" stop-color="var(--flower-mid)"/>
            <stop offset="100%" stop-color="transparent"/>
          </radialGradient>
          <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="2" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
          </filter>
        </defs>

        <path class="blade" d="M30,400 C20,310 45,230 65,180 C50,260 45,330 45,400 Z" style="animation-delay:.1s"/>
        <path class="blade" d="M55,400 C45,320 70,250 85,210 C70,280 65,340 65,400 Z" style="animation-delay:.25s"/>
        <path class="blade" d="M280,400 C290,300 260,220 240,170 C255,250 260,320 260,400 Z" style="animation-delay:.15s"/>
        <path class="blade" d="M255,400 C265,310 240,240 225,195 C238,270 242,335 242,400 Z" style="animation-delay:.3s"/>

        <path class="stem" d="M125,395 C122,320 134,250 138,180" style="animation-delay:.1s"/>
        <path class="stem" d="M160,395 C158,310 160,230 160,135" style="animation-delay:.3s"/>
        <path class="stem" d="M192,395 C195,325 186,255 180,185" style="animation-delay:.4s"/>

        <path class="leaf" d="M132,280 C114,275 104,285 100,298 C118,302 130,294 132,280 Z" style="animation-delay:.9s"/>
        <path class="leaf" d="M162,240 C182,234 194,242 198,256 C180,262 166,254 162,240 Z" style="animation-delay:1.05s"/>
        <path class="leaf" d="M184,290 C202,285 212,293 215,306 C198,310 186,302 184,290 Z" style="animation-delay:1.2s"/>

        <g id="berryLayer"></g>

        <g id="flowerLayer"></g>
      </svg>
    </div>

    <div class="message">
      <span class="line1">Espero muito te encontrar…</span>
      <span class="line2">mas quando e onde?</span>
    </div>

    <div class="cta">
      <button class="btn" onclick="goTo(2)">Vamos combinar 💫</button>
    </div>
  </section>

  <section class="screen" id="screen2">
    <button class="back-btn" onclick="goTo(1)">‹</button>
    <div class="title-block">
      <h2>Quando podemos nos ver?</h2>
      <div class="sub">escolha o dia e o horário</div>
    </div>

    <div class="card-panel">
      <div class="cal-head">
        <button onclick="changeMonth(-1)">‹</button>
        <div class="cal-month" id="calMonth"></div>
        <button onclick="changeMonth(1)">›</button>
      </div>
      <div class="cal-grid" id="calGrid"></div>

      <div class="time-label">Horário</div>
      <div class="time-chips" id="timeChips"></div>
    </div>

    <div class="next-wrap">
      <button class="btn" id="btnToStep3" disabled onclick="goTo(3)">Continuar</button>
    </div>
  </section>

  <section class="screen" id="screen3">
    <button class="back-btn" onclick="goTo(2)">‹</button>
    <div class="title-block">
      <h2>Para onde vamos?</h2>
      <div class="sub">escolha o cenário do nosso encontro</div>
    </div>

    <div class="places-grid" id="placesGrid"></div>

    <div class="next-wrap">
      <button class="btn" id="btnToStep4" disabled onclick="goTo(4)">Continuar</button>
    </div>
  </section>

  <section class="screen" id="screen4">
    <button class="back-btn" onclick="goTo(3)">‹</button>
    <div class="seal">🔮</div>
    <div class="title-block" style="margin-bottom:4px;">
      <h2>Só falta confirmar</h2>
      <div class="sub">e te mandar a resposta 💜</div>
    </div>

    <div class="summary" id="summaryBox"></div>

    <button class="btn wa-btn" onclick="sendWhatsapp()">Enviar no WhatsApp 💌</button>
  </section>

</div>

<script>
const WHATSAPP_NUMBER = "5511973513832";

/* ---------------- state ---------------- */
const state = { date:null, dateLabel:null, time:null, place:null };

/* ---------------- background stars ---------------- */
(function makeStars(){
  const sky = document.getElementById('sky');
  const n = 55;
  for(let i=0;i<n;i++){
    const s = document.createElement('div');
    s.className='star';
    const size = Math.random()*2 + 1;
    s.style.width = size+'px';
    s.style.height = size+'px';
    s.style.left = Math.random()*100+'%';
    s.style.top = Math.random()*100+'%';
    s.style.animationDelay = (Math.random()*3.2)+'s';
    s.style.animationDuration = (2.4+Math.random()*2.4)+'s';
    sky.appendChild(s);
  }
})();

/* ---------------- bouquet: glowing flowers + magic dust ---------------- */
const SVGNS = "http://www.w3.org/2000/svg";

/* Cria flores roxas de 5 pétalas arredondadas e sobrepostas com centro brilhante */
function makeGlowingFlower(cx, cy, scale, baseDelay, rotate){
  const g = document.createElementNS(SVGNS,'g');
  g.setAttribute('transform', `translate(${cx},${cy}) scale(${scale}) rotate(${rotate||0})`);
  g.setAttribute('filter', 'url(#softGlow)');

  // 5 Pétalas perfeitamente arredondadas distribuídas radialmente como na imagem
  const petalAngles = [0, 72, 144, 216, 288];
  petalAngles.forEach((angle, i) => {
    const p = document.createElementNS(SVGNS,'path');
    // Formato oval/arredondado macio das pétalas da referência
    p.setAttribute('d', 'M0,0 C-14,-9 -16,-26 0,-34 C16,-26 14,-9 0,0 Z');
    p.setAttribute('class','petal');
    p.setAttribute('fill','url(#purplePetalGrad)');
    p.setAttribute('transform', `rotate(${angle})`);
    p.style.animationDelay = (baseDelay + i*0.06)+'s';
    g.appendChild(p);
  });

  // Centro grande e brilhante (Neon Amarelo/Branco)
  const glow = document.createElementNS(SVGNS,'circle');
  glow.setAttribute('cx',0); glow.setAttribute('cy',0); glow.setAttribute('r',9);
  glow.setAttribute('fill','url(#glowCenterGrad)');
  glow.setAttribute('class','fcenter');
  glow.style.animationDelay = (baseDelay + 0.35)+'s';
  g.appendChild(glow);

  // Geração de partículas de luz neon flutuando acima da flor
  for(let i=0; i<6; i++){
    const pt = document.createElementNS(SVGNS,'circle');
    pt.setAttribute('cx', (Math.random() * 30) - 15);
    pt.setAttribute('cy', (Math.random() * 20) - 30);
    pt.setAttribute('r', 1 + Math.random() * 1.5);
    pt.setAttribute('fill', 'var(--flower-center)');
    pt.setAttribute('class', 'magic-particle');
    
    // Direção aleatória de dispersão da partícula
    pt.style.setProperty('--mx', ((Math.random() * 40) - 20) + 'px');
    pt.style.setProperty('--my', (-(40 + Math.random() * 40)) + 'px');
    pt.style.animationDelay = (baseDelay + 0.5 + (i * 0.2)) + 's';
    g.appendChild(pt);
  }

  return g;
}

/* Base de folhagens roxas complementares */
function makeLeafCluster(cx, cy, count, baseDelay){
  const g = document.createElementNS(SVGNS,'g');
  for(let i=0;i<count;i++){
    const a = Math.random()*Math.PI*2, r = Math.random()*14;
    const c = document.createElementNS(SVGNS,'circle');
    c.setAttribute('cx', cx + Math.cos(a)*r);
    c.setAttribute('cy', cy + Math.sin(a)*r*0.7);
    c.setAttribute('r', 5 + Math.random()*4);
    c.setAttribute('fill','var(--berry)');
    c.setAttribute('class','berry');
    c.style.animationDelay = (baseDelay + i*0.05)+'s';
    g.appendChild(c);
  }
  return g;
}

const flowerLayer = document.getElementById('flowerLayer');
const berryLayer = document.getElementById('berryLayer');

berryLayer.appendChild(makeLeafCluster(120, 360, 6, 1.4));
berryLayer.appendChild(makeLeafCluster(185, 355, 6, 1.5));

// Organização idêntica das 3 flores roxas da imagem enviada
flowerLayer.appendChild(makeGlowingFlower(132, 180, 1.05, 1.8, -8));
flowerLayer.appendChild(makeGlowingFlower(160, 135, 1.20, 2.1, 4));
flowerLayer.appendChild(makeGlowingFlower(184, 185, 0.95, 2.4, 15));

/* ---------------- navigation ---------------- */
function goTo(step){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('screen'+step).classList.add('active');

  const prog = document.getElementById('progress');
  if(step >= 2){
    prog.classList.add('show');
    document.querySelectorAll('.dot').forEach(d=>{
      const ds = parseInt(d.dataset.step);
      d.classList.toggle('active', ds===step);
      d.classList.toggle('done', ds<step);
    });
  } else {
    prog.classList.remove('show');
  }
  if(step===4) renderSummary();
}

/* ---------------- calendar ---------------- */
const monthNames = ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
const weekDays = ["D","S","T","Q","Q","S","S"];
let viewDate = new Date();
viewDate.setDate(1);
const today = new Date(); today.setHours(0,0,0,0);

function renderCalendar(){
  document.getElementById('calMonth').textContent = monthNames[viewDate.getMonth()] + " " + viewDate.getFullYear();
  const grid = document.getElementById('calGrid');
  grid.innerHTML = '';
  weekDays.forEach(w=>{
    const el = document.createElement('div');
    el.className='wd'; el.textContent=w;
    grid.appendChild(el);
  });
  const firstDay = new Date(viewDate.getFullYear(), viewDate.getMonth(), 1).getDay();
  const daysInMonth = new Date(viewDate.getFullYear(), viewDate.getMonth()+1, 0).getDate();

  for(let i=0;i<firstDay;i++){
    const el = document.createElement('div');
    el.className='cal-day empty';
    grid.appendChild(el);
  }
  for(let d=1; d<=daysInMonth; d++){
    const el = document.createElement('div');
    el.className='cal-day';
    el.textContent = d;
    const thisDate = new Date(viewDate.getFullYear(), viewDate.getMonth(), d);
    thisDate.setHours(0,0,0,0);
    if(thisDate < today){
      el.classList.add('disabled');
    } else {
      el.onclick = ()=> selectDate(thisDate, el);
    }
    if(state.date && thisDate.getTime()===state.date.getTime()){
      el.classList.add('selected');
    }
    grid.appendChild(el);
  }
}
function changeMonth(delta){
  viewDate.setMonth(viewDate.getMonth()+delta);
  renderCalendar();
}
function selectDate(d, el){
  document.querySelectorAll('.cal-day.selected').forEach(x=>x.classList.remove('selected'));
  el.classList.add('selected');
  state.date = d;
  const wd = ["domingo","segunda-feira","terça-feira","quarta-feira","quinta-feira","sexta-feira","sábado"][d.getDay()];
  state.dateLabel = `${wd}, ${d.getDate()} de ${monthNames[d.getMonth()]}`;
  checkStep2();
}
renderCalendar();

  el.classList.add('selected');

function checkStep2(){
  document.getElementById('btnToStep3').disabled = !(state.date && state.time);
