<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Um convite especial 🌻</title>
<style>
  :root{ --navy-deep:#0b1730; --sunflower:#f4b942; --blue-rose:#4a90e2; --tango:#ffcc00; --leaf:#5f8a4e; }
  body{ margin:0; background:var(--navy-deep); color:#faf3e2; display:flex; justify-content:center; align-items:center; min-height:100vh; overflow:hidden; font-family:'Poppins', sans-serif; }
  .app { width: 100%; max-width: 430px; height: 100vh; display: flex; flex-direction: column; align-items: center; }
  
  /* Animação das flores subindo */
  .flower-group { animation: rise 2s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; opacity: 0; }
  @keyframes rise { from { transform: translateY(100px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  .stem { stroke: var(--leaf); stroke-width: 2; fill: none; animation: draw 2s ease forwards; stroke-dasharray: 200; stroke-dashoffset: 200; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
</style>
</head>
<body>

<div class="app">
    <section class="screen active" id="screen1">
        <div class="bouquet-wrap" style="width:300px; height:400px; margin-top:50px;">
            <svg viewBox="0 0 200 300" id="bouquetSvg">
                </svg>
        </div>
        <button class="btn" onclick="goTo(2)">Vamos combinar 💫</button>
    </section>
</div>

<script>
function drawBouquet() {
    const svg = document.getElementById('bouquetSvg');
    const flowers = [
        {type: 'sunflower', color: '#f4b942', x: 50}, {type: 'sunflower', color: '#f4b942', x: 100}, {type: 'sunflower', color: '#f4b942', x: 150},
        {type: 'rose', color: '#4a90e2', x: 65}, {type: 'rose', color: '#4a90e2', x: 100}, {type: 'rose', color: '#4a90e2', x: 135},
        {type: 'tango', color: '#ffcc00', x: 80}, {type: 'tango', color: '#ffcc00', x: 120}
    ];

    flowers.forEach((f, i) => {
        const delay = i * 0.2;
        // Desenha o caule
        svg.innerHTML += `<path class="stem" d="M100,300 C${f.x},200 ${f.x},150 ${f.x},100" style="animation-delay:${delay}s"/>`;
        // Desenha a flor
        svg.innerHTML += `
            <g class="flower-group" style="animation-delay:${delay}s">
                <circle cx="${f.x}" cy="100" r="${f.type === 'sunflower' ? 15 : 10}" fill="${f.color}" />
                <circle cx="${f.x}" cy="100" r="5" fill="#332211" />
            </g>`;
    });
}
drawBouquet();

function goTo(step) { alert("Navegando para o passo " + step); }
</script>
</body>
</html>
