  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}

  /* ---------- background: starry night ---------- */
  .sky{

    overflow:hidden;

  .swirl{
    position:absolute;
    border-radius:50%;
    filter:blur(18px);
    opacity:.35;
    background:conic-gradient(from 0deg, var(--swirl), transparent 40%, var(--navy-hi) 60%, transparent 90%);
    animation:swirlRotate 50s linear infinite;
  }
  .swirl.s1{width:340px; height:340px; top:-80px; left:-90px; animation-duration:70s;}
  .swirl.s2{width:260px; height:260px; bottom:-60px; right:-70px; animation-duration:55s; animation-direction:reverse;}
  .swirl.s3{width:200px; height:200px; top:40%; left:60%; animation-duration:40s;}
  @keyframes swirlRotate{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}

  .star{
    position:absolute;
    background:#fff7dd;
    border-radius:50%;
    animation:twinkle 3.2s ease-in-out infinite;
  }
  @keyframes twinkle{0%,100%{opacity:.15;}50%{opacity:1;}}

  /* ---------- app shell ---------- */
  .app{

    z-index:1;

    max-width:430px;
    height:100vh;
    height:100dvh;
    max-height:900px;
    display:flex;
    flex-direction:column;
    padding:0;
  }

  .progress{
    display:none;
    align-items:center;
    justify-content:center;
    gap:8px;
    padding:18px 0 6px;
    z-index:3;
  }
  .progress.show{display:flex;}
  .dot{width:7px; height:7px; border-radius:50%; background:rgba(250,243,226,.25); transition:all .35s ease;}
  .dot.active{background:var(--gold-hi); width:20px; border-radius:5px;}
  .dot.done{background:var(--gold);}

  .back-btn{
    position:absolute;
    top:16px; left:14px;
    z-index:5;
    background:rgba(250,243,226,.1);
    border:1px solid rgba(250,243,226,.25);
    color:var(--cream);
    width:36px; height:36px;
    border-radius:50%;
    font-size:16px;
    display:none;
    align-items:center;
    justify-content:center;
    cursor:pointer;
  }
  .screen.active .back-btn{display:flex;}

  .screen{
    display:none;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    flex:1;
    width:100%;
    padding:14px 24px 28px;
    position:relative;
    overflow-y:auto;
  }
  .screen.active{display:flex;}
  .screen.active > *{animation:fadeUp .7s ease both;}

  @keyframes fadeUp{
    0%{opacity:0; transform:translateY(16px);}
    100%{opacity:1; transform:translateY(0);}
  }

  h1,h2{font-family:'Playfair Display',serif; margin:0;}

  #screen1{justify-content:center; padding-top:0;}

    width:100%;

    aspect-ratio:3/4;
    margin: 0 auto 20px;

  }
  .bouquet-wrap svg{width:100%; height:100%; overflow:visible;}

  .stem{
    fill:none;
    stroke:var(--leaf-dark);
    stroke-width:5.5;
    stroke-linecap:round;
    stroke-dasharray:260;
    stroke-dashoffset:260;
    animation:drawStem 1.3s ease forwards;
  }
  @keyframes drawStem{to{stroke-dashoffset:0;}}

  .leaf{
    fill:var(--leaf);
    opacity:0;
    transform-box:fill-box;
    transform-origin:center;
    animation:leafPop .6s ease forwards;
  }
  @keyframes leafPop{
    0%{opacity:0; transform:scale(0) rotate(-14deg);}

  }

  .paper{

    transform-box:fill-box;

    animation:paperRise 1s cubic-bezier(.2,.8,.3,1.1) forwards;
  }
  @keyframes paperRise{
    0%{opacity:0; transform:scaleY(0);}
    100%{opacity:1; transform:scaleY(1);}
  }

  .puff-layer{
    opacity:0;
    animation: fadeInPuff 2.5s ease forwards;
  }
  @keyframes fadeInPuff{
    0%{ opacity:0; }
    100%{ opacity:1; }
  }

  .flower{
    opacity:0;
    transform-box:fill-box;
    transform-origin:center;
    animation:flowerPop 0.8s cubic-bezier(.3,1.4,.5,1) forwards;
  }
  @keyframes flowerPop{
    0%{opacity:0; transform:scale(0) rotate(-15deg);}
    80%{opacity:1; transform:scale(1.1) rotate(5deg);}
    100%{opacity:1; transform:scale(1) rotate(0deg);}
  }

  .ribbon{
    opacity:0;
    transform-box:fill-box;
    transform-origin:center;
    animation:ribbonPop .8s cubic-bezier(.3,1.6,.4,1) forwards;
  }
  @keyframes ribbonPop{
    0%{opacity:0; transform:scale(0) rotate(-18deg);}
    60%{opacity:1; transform:scale(1.12) rotate(6deg);}
    100%{opacity:1; transform:scale(1) rotate(0deg);}
  }

  .message{
    text-align:center;
    margin-top:6px;
  }
  .message .line1{
    font-family:'Dancing Script',cursive;
    font-size:clamp(26px,7vw,34px);
    color:var(--gold-hi);
    opacity:0;
    animation:fadeUp .8s ease forwards;
    animation-delay:2.6s;
    display:block;
  }
  .message .line2{
    font-family:'Playfair Display',serif;
    font-style:italic;
    font-size:clamp(17px,4.6vw,20px);
    color:var(--cream);
    opacity:.92;
    margin-top:6px;
    opacity:0;
    animation:fadeUp .8s ease forwards;
    animation-delay:3.3s;
    display:block;
  }
  .cta{
    opacity:0;
    animation:fadeUp .8s ease forwards;
    animation-delay:4.2s;
    margin-top:20px;
  }

  /* ---------- buttons ---------- */
  .btn{
    font-family:'Poppins',sans-serif;
    font-weight:500;
    font-size:15px;
    letter-spacing:.3px;
    border:none;
    border-radius:999px;
    padding:14px 30px;
    background:linear-gradient(135deg, var(--gold-hi), var(--gold));
    color:#2a1c05;
    cursor:pointer;
    box-shadow:0 6px 18px rgba(217,164,65,.35);
    transition:transform .2s ease, box-shadow .2s ease, opacity .2s ease;
  }
  .btn:active{transform:scale(.96);}
  .btn:disabled{opacity:.35; box-shadow:none; cursor:not-allowed;}
  .btn.ghost{
    background:transparent;
    border:1.5px solid var(--gold);
    color:var(--gold-hi);
    box-shadow:none;
  }

  /* ---------- SCREEN 2: calendar ---------- */
  .title-block{text-align:center; margin-bottom:18px;}
  .title-block h2{font-size:clamp(21px,5.5vw,26px); color:var(--cream);}
  .title-block .sub{font-size:13px; color:var(--gold-hi); font-style:italic; font-family:'Playfair Display',serif; margin-top:4px;}

  .card-panel{
    background:linear-gradient(160deg, var(--cream), var(--cream-dim));

    border-radius:22px;
    padding:18px 16px;

    max-width:360px;
    box-shadow:0 14px 30px rgba(0,0,0,.35);
  }

  .cal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
  .cal-head button{
    background:none; border:none; font-size:18px; color:var(--brown); cursor:pointer;
    width:32px; height:32px; border-radius:50%;
  }
  .cal-head button:hover{background:rgba(90,58,30,.08);}
  .cal-month{font-family:'Playfair Display',serif; font-weight:600; font-size:16px; text-transform:capitalize;}

  .cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:4px; text-align:center;}
  .cal-grid .wd{font-size:11px; color:var(--brown); opacity:.6; padding-bottom:4px;}
