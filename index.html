<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Convite Especial 🌻</title>
<style>
    :root {
        --navy-deep: #0b1730; --gold: #d9a441; --cream: #faf3e2; --ink: #241e0f;
        --sunflower: #ffc300; --blue-rose: #0017ff; --white: #ffffff;
    }
    body { margin: 0; font-family: 'Poppins', sans-serif; background: var(--navy-deep); color: var(--cream); display: flex; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }
    .app { width: 100%; max-width: 400px; height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px; }
    
    /* Estilos do Buquê */
    .bouquet-box { width: 100%; max-width: 300px; height: 350px; }
    .f-anim { animation: appear 1.5s ease-out forwards; opacity: 0; }
    @keyframes appear { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    
    .btn { background: var(--gold); border: none; padding: 15px 30px; border-radius: 25px; color: var(--ink); font-weight: bold; cursor: pointer; margin-top: 20px; }
    .screen { display: none; width: 100%; text-align: center; }
    .screen.active { display: block; }
    
    /* Grade de Horários */
    .time-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 15px; }
    .time-chip { padding: 10px; border: 1px solid var(--gold); border-radius: 10px; cursor: pointer; }
    .time-chip.selected { background: var(--gold); color: var(--navy-deep); }
</style>
</head>
<body>

<div class="app">
    <section class="screen active" id="s1">
        <h2>Um convite especial</h2>
        <div class="bouquet-box">
            <svg viewBox="0 0 200 250">
                <path d="M50,250 L150,250 L170,150 L30,150 Z" fill="#0d2a57" />
                <circle cx="70" cy="80" r="30" fill="var(--sunflower)" class="f-anim" style="animation-delay: 0.5s"/>
                <circle cx="130" cy="80" r="30" fill="var(--sunflower)" class="f-anim" style="animation-delay: 0.7s"/>
                <circle cx="100" cy="130" r="20" fill="var(--blue-rose)" class="f-anim" style="animation-delay: 0.9s"/>
                <rect x="80" y="140" width="40" height="20" fill="var(--gold)" />
            </svg>
        </div>
        <button class="btn" onclick="next(2)">Vamos combinar 💫</button>
    </section>

    <section class="screen" id="s2">
        <h3>Escolha o horário</h3>
        <div class="time-grid" id="timeGrid"></div>
        <button class="btn" onclick="next(3)" id="btnNext2" disabled>Continuar</button>
    </section>

    <section class="screen" id="s3">
        <h3>Pronto!</h3>
        <button class="btn" onclick="send()">Enviar no WhatsApp 💌</button>
    </section>
</div>

<script>
    const state = { time: null };
    
    // Gerar horários 10:00 às 21:00
    const grid = document.getElementById('timeGrid');
    for(let h=10; h<=21; h++){
        const t = `${h}:00`;
        const div = document.createElement('div');
        div.className = 'time-chip';
        div.innerText = t;
        div.onclick = () => {
            state.time = t;
            document.querySelectorAll('.time-chip').forEach(el => el.classList.remove('selected'));
            div.classList.add('selected');
            document.getElementById('btnNext2').disabled = false;
        };
        grid.appendChild(div);
    }

    function next(step) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById('s' + step).classList.add('active');
    }

    function send() {
        window.location.href = `https://wa.me/5511973513832?text=Oi! Escolhi o horário das ${state.time} para o nosso encontro.`;
    }
</script>
</body>
</html>
